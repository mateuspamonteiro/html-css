<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 05 — Caption e escopo de títulos</title>

<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 24px; color: #222; background: #f5f7fa; }
main { max-width: 950px; margin: auto; background: white; padding: 24px; border-radius: 12px; }
h1 { color: #174a7e; }
table { border-collapse: collapse; width: 100%; margin: 18px 0; }
caption { font-weight: bold; padding: 10px; }
th, td { border: 1px solid #555; padding: 10px; text-align: center; }
thead, tfoot { background: #dceaf7; }
tbody tr:nth-child(even) { background: #eef3f8; }
.note { background: #fff6d9; padding: 12px; border-left: 4px solid #d5a400; }
.wrapper { overflow-x: auto; }
.sticky thead th { position: sticky; top: 0; background: #174a7e; color: white; }
.wide { min-width: 780px; }
</style>

</head>
<body><main>
<h1>Aula 05 — Caption e escopo de títulos</h1>
<p><code>caption</code> dá um título à tabela. Em <code>th</code>, use <code>scope="col"</code> para cabeçalho de coluna e <code>scope="row"</code> para cabeçalho de linha.</p><table><caption>População fictícia por cidade</caption><thead><tr><th scope="col">Cidade</th><th scope="col">Habitantes</th></tr></thead><tbody><tr><th scope="row">Chapecó</th><td>250.000</td></tr><tr><th scope="row">Concórdia</th><td>80.000</td></tr></tbody></table>
<p><a href="../LEIA-ME.txt">Voltar ao guia</a></p>
</main></body>
</html>
