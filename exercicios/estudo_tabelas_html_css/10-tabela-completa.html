<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 10 — Exemplo de tabela completa</title>

<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 24px; color: #222; background: #f5f7fa; }
main { max-width: 950px; margin: auto; background: white; padding: 24px; border-radius: 12px; }
h1 { color: #174a7e; }
table { border-collapse: collapse; width: 100%; margin: 18px 0; }
caption { font-weight: bold; padding: 10px; }
th, td { border: 1px solid #555; padding: 10px; text-align: center; }
thead, tfoot { background: #dceaf7; }
tbody tr:nth-child(even) { background: #eef3f8; }
.note { background: #fff6d9; padding: 12px; border-left: 4px solid #d5a400; }
.wrapper { overflow-x: auto; }
.sticky thead th { position: sticky; top: 0; background: #174a7e; color: white; }
.wide { min-width: 780px; }
</style>

</head>
<body><main>
<h1>Aula 10 — Exemplo de tabela completa</h1>
<p>Exemplo reunindo legenda, cabeçalho, corpo, rodapé, escopos e estilo.</p><table><caption>Desempenho da turma</caption><thead><tr><th scope="col">Estudante</th><th scope="col">HTML</th><th scope="col">CSS</th><th scope="col">Média</th></tr></thead><tbody><tr><th scope="row">Ana</th><td>9</td><td>8</td><td>8,5</td></tr><tr><th scope="row">Bruno</th><td>7</td><td>8</td><td>7,5</td></tr><tr><th scope="row">Caio</th><td>8</td><td>9</td><td>8,5</td></tr></tbody><tfoot><tr><th colspan="3">Média geral</th><td>8,2</td></tr></tfoot></table>
<p><a href="../LEIA-ME.txt">Voltar ao guia</a></p>
</main></body>
</html>
