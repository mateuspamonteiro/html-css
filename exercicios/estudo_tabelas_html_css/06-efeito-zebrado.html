<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 06 — Efeito zebrado</title>

<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 24px; color: #222; background: #f5f7fa; }
main { max-width: 950px; margin: auto; background: white; padding: 24px; border-radius: 12px; }
h1 { color: #174a7e; }
table { border-collapse: collapse; width: 100%; margin: 18px 0; }
caption { font-weight: bold; padding: 10px; }
th, td { border: 1px solid #555; padding: 10px; text-align: center; }
thead, tfoot { background: #dceaf7; }
tbody tr:nth-child(even) { background: #eef3f8; }
.note { background: #fff6d9; padding: 12px; border-left: 4px solid #d5a400; }
.wrapper { overflow-x: auto; }
.sticky thead th { position: sticky; top: 0; background: #174a7e; color: white; }
.wide { min-width: 780px; }
</style>

</head>
<body><main>
<h1>Aula 06 — Efeito zebrado</h1>
<p>A pseudo-classe <code>:nth-child(even)</code> seleciona linhas pares. O CSS deste arquivo aplica cores alternadas automaticamente.</p><table><thead><tr><th>Aluno</th><th>Nota</th></tr></thead><tbody><tr><td>Ana</td><td>9,0</td></tr><tr><td>Bruno</td><td>7,5</td></tr><tr><td>Caio</td><td>8,0</td></tr><tr><td>Duda</td><td>9,5</td></tr><tr><td>Eva</td><td>6,5</td></tr></tbody></table>

</main></body>
