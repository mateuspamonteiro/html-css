<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula 02 — Sua primeira tabela</title>

<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 24px; color: #222; background: #f5f7fa; }
main { max-width: 950px; margin: auto; background: white; padding: 24px; border-radius: 12px; }
h1 { color: #174a7e; }
table { border-collapse: collapse; width: 100%; margin: 18px 0; }
caption { font-weight: bold; padding: 10px; }
th, td { border: 1px solid #555; padding: 10px; text-align: center; }
thead, tfoot { background: #dceaf7; }
tbody tr:nth-child(even) { background: #eef3f8; }
.note { background: #fff6d9; padding: 12px; border-left: 4px solid #d5a400; }
.wrapper { overflow-x: auto; }
.sticky thead th { position: sticky; top: 0; background: #174a7e; color: white; }
.wide { min-width: 780px; }
</style>

</head>
<body><main>
<h1>Aula 02 — Sua primeira tabela</h1>
<p><code>table</code> cria a tabela; <code>tr</code> cria uma linha; <code>th</code> cria uma célula de cabeçalho; <code>td</code> cria uma célula de dado.</p><table><tr><th>Nome</th><th>Idade</th><th>Cidade</th></tr><tr><td>Ana</td><td>20</td><td>Chapecó</td></tr><tr><td>Bruno</td><td>22</td><td>Joinville</td></tr><tr><td>Caio</td><td>19</td><td>Florianópolis</td></tr></table>
<p><a href="../LEIA-ME.txt">Voltar ao guia</a></p>
</main></body>
</html>
