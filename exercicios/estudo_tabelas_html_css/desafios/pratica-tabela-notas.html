<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Prática — tabela de notas</title>
<style>body{font-family:Arial;margin:24px;background:#f5f7fa}main{max-width:800px;margin:auto;background:white;padding:24px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #555;padding:10px;text-align:center}thead,tfoot{background:#dceaf7}tbody tr:nth-child(even){background:#eee}</style>
</head><body><main><h1>Prática — tabela de notas e médias</h1>
<p>Exemplo complementar: pratique cabeçalhos, corpo, rodapé, escopo e cálculo de média.</p>
<table><caption>Notas por área</caption><thead><tr><th scope="col">Aluno</th><th scope="col">Linguagens</th><th scope="col">Matemática</th><th scope="col">Média</th></tr></thead>
<tbody><tr><th scope="row">Ana</th><td>8</td><td>9</td><td>8,5</td></tr><tr><th scope="row">Bruno</th><td>7</td><td>8</td><td>7,5</td></tr><tr><th scope="row">Caio</th><td>9</td><td>8</td><td>8,5</td></tr></tbody>
<tfoot><tr><th colspan="3">Média da turma</th><td>8,17</td></tr></tfoot></table>
<p><strong>Exercício:</strong> acrescente um aluno, duas disciplinas e atualize as médias.</p></main></body></html>
