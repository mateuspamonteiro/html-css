<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(to bottom, #c8c8c8, white);
            background-repeat: no-repeat;
        }

        h1 {
            font-size: 28pt;
            margin: 0 0 20px 0;
        }

        /* camada de sombra para dar o degradê nas cores */
        .tabela-wrap {
            position: relative;
            display: inline-block;
        }

        .tabela-wrap::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0));
        }

        table {
            border-collapse: collapse;
            font-size: 13pt;
            width: 500px;
        }

        caption {
            font-weight: bold;
            font-size: 15pt;
            padding-bottom: 10px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            text-align: center;
        }

        /* colgroup: cores de cada coluna */
        col.amarelo { background-color: #ffee00; }
        col.vermelho { background-color: #ff0000; }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <div class="tabela-wrap">
        <table>
            <caption>Cadastro</caption>

            <colgroup>
                <col class="amarelo">
                <col span="2" class="vermelho">
                <col class="amarelo">
            </colgroup>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Sexo</th>
                    <th>Idade</th>
                    <th>Profissão</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Ana Maria</td>
                    <td>F</td>
                    <td>25</td>
                    <td>Jornalista</td>
                </tr>
                <tr>
                    <td>Cláudio</td>
                    <td>M</td>
                    <td>28</td>
                    <td>Programador</td>
                </tr>
                <tr>
                    <td>Gustavo</td>
                    <td>M</td>
                    <td>42</td>
                    <td>Professor</td>
                </tr>
                <tr>
                    <td>Hélio</td>
                    <td>M</td>
                    <td>19</td>
                    <td>Vendedor</td>
                </tr>
                <tr>
                    <td>Maria</td>
                    <td>F</td>
                    <td>38</td>
                    <td>Médica</td>
                </tr>
                <tr>
                    <td>Otávio</td>
                    <td>M</td>
                    <td>22</td>
                    <td>Nutricionista</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
