<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio - Tabela de Notas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
        }

        table {
            border-collapse: collapse;
            font-size: 16pt;
        }

        th, td {
            border: 1px solid black;
            padding: 4px 8px;
        }

        thead th {
            background-color: #808080;
            color: white;
        }

        /* colgroup: largura e alinhamento das colunas */
        col.area  { width: 120px; }
        col.disc  { width: 135px; }
        col.nota  { width: 75px; }
        col.media { width: 75px; }

        td.centro, td.num {
            text-align: center;
        }

        td.area {
            background-color: white;
            font-weight: bold;
            text-align: center;
            vertical-align: middle;
        }

        /* Linhas de média */
        tr.media th,
        tr.media td {
            background-color: #7f7f7f;
            color: white;
            font-weight: bold;
        }

        tr.media th {
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="area">
            <col class="disc">
            <col class="nota">
            <col class="nota">
            <col class="media">
        </colgroup>

        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>

        <tbody>
            <!-- Exatas -->
            <tr>
                <td class="area" rowspan="4">Exatas</td>
                <td>Matemática</td>
                <td class="num">8.0</td>
                <td class="num">7.0</td>
                <td class="num">7.5</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="num">6.0</td>
                <td class="num">7.0</td>
                <td class="num">6.5</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="num">9.0</td>
                <td class="num">8.0</td>
                <td class="num">8.5</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="num">7.0</td>
                <td class="num">8.0</td>
                <td class="num">7.5</td>
            </tr>
            <tr class="media">
                <th colspan="4">Média de Exatas</th>
                <td class="num">7.5</td>
            </tr>

            <!-- Humanas -->
            <tr>
                <td class="area" rowspan="2">Humanas</td>
                <td>História</td>
                <td class="num">8.0</td>
                <td class="num">9.0</td>
                <td class="num">8.5</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="num">6.0</td>
                <td class="num">7.0</td>
                <td class="num">6.5</td>
            </tr>
            <tr class="media">
                <th colspan="4">Média de Humanas</th>
                <td class="num">7.5</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
