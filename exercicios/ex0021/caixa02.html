<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping tags

    </title>
    <style> 
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: dimgray;
        margin: 0;
        }
        header {
            background-color: white;
           padding: 10px;
           MARGIN :10PX;
         
        }

               H1{
                BOX-SHADOW: 5PX 3PX 7PX 1PX rgb(48, 46, 46);
               }     
        
        
        

        
        NAV {
            background-color: rgb(43, 40, 40);
            PADDING: 3PX;
            box-shadow: 5px 3px 7px 1px black;
        
        }
        NAV> A {
            color: white;
            text-decoration: none;
            FONT-WEIGHT: BOLD;
            margin-right: 30PX;
        }
        NAV> a:HOVER {
           
            text-decoration: underline;
            
        }
        MAIN {
            background-color:white
            ;
            padding: 10px;
            margin: 10px;
            BORDER-RADIUS: 10PX OPX;
            BOX-SHADOW: 4PX 4PX 9PX 0PX rgb(61, 53, 53) 
        }
            ARTICLE {
                background-color: lightgray;
                PADDING: 5PX;
            }
                   
            ARTICLE > ASIDE{
            BACKGROUND-COLOR: gray;                                                                                           
        }
        FOOTER {
            background-color: BLACK;
            COLOR: WHITE;
            TEXT-ALIGN: CENTER;
            padding: 0px;
            margin: 0px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Meu site</h1>
        <nav>
            <a href="">Link 1</a>
            <a href="">Link 2</a>
            <a href="">Link 3</a>
                <a href="">Link 4</a>
                <a href="">Link 5</a>

        </nav>

    </header>
    <main>
<section id="Assuntos"> 
    <P> política e informação.</P>

</section>
    
<section id=" Notícias"> 
    <article>
        <h2>Notícia 1</h2>
        <p> Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</p>
        <aside>
            <p> Artigo escrito por John Doe</p>
        </aside>
    </article>

</section>
    </main>
    <footer>
        <p> desenvolvido pelo curso em vídeo</p>
    </footer>
</body>
</html>
